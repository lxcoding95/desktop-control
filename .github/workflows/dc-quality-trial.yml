# SEC-GATE-001 candidate universal PR baseline. PR-only, no token permissions,
# no installed marketplace actions, no secrets, no write/deploy/release steps.
name: Desktop Control - universal read-only baseline

on:
  # Always run for any PR once merged to main. Do not use paths filters for
  # required checks: skipped check runs would otherwise block unrelated PRs.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: dc-quality-trial-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  synthetic-privacy-tests:
    name: Synthetic privacy test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    permissions: {}
    steps:
      - name: Fetch exact public PR merge commit without a token
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          git init -q .
          git remote add origin https://github.com/lxcoding95/desktop-control.git
          git -c protocol.version=2 fetch -q --depth=1 --no-tags origin "refs/pull/${PR_NUMBER}/merge"
          git -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git status --porcelain)" ]]

      - name: Check Node runtime and scanner syntax
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 22 || (major === 22 && minor < 16)) process.exit(1)'
          node --check tools/governance/public-guard.mjs
          node --check tools/governance/public-guard.test.mjs

      - name: Run isolated positive and negative privacy tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tools/governance/public-guard.test.mjs
