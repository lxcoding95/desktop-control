name: Technical task
description: Track governance, security, documentation or engineering chores.
title: "chore: "
labels:
  - "type: maintenance"
body:
  - type: textarea
    id: scope
    attributes:
      label: Objective and scope
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Work plan and dependencies
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Definition of done and verification
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Security, platform and rollback considerations
