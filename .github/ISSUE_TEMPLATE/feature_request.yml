name: Feature request
description: Propose a new capability or improvement.
title: "feat: "
labels:
  - "type: feature"
body:
  - type: textarea
    id: objective
    attributes:
      label: Problem and user outcome
      description: Describe the need rather than only a desired implementation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed behavior and non-goals
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Permissions and security impact
      description: Include trust boundaries, data access and relevant abuse cases.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and test plan
    validations:
      required: true
