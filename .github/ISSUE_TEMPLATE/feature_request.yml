name: Feature request
description: Propose a new capability or improvement.
title: "feat: "
labels:
  - "type: feature"
body:
  - type: textarea
    id: objective
    attributes:
      label: Problem and user outcome
      description: Describe the need rather than only a desired implementation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed behavior and non-goals
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Permissions and security impact
      description: Include trust boundaries, data access and relevant abuse cases.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and test plan
    validations:
      required: true
  - type: input
    id: product_milestone
    attributes:
      label: Product outcome milestone (M01–M06 or M07+)
      description: Product milestone ID, not private S01–S06 session. Write proposed if not assigned.
      placeholder: M01 or proposed
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies, versions, platforms and rollout
      description: Include update/compatibility and recovery implications. Never post credentials or private host logs.
