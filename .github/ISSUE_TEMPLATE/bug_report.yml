name: Bug report
description: Report a reproducible issue in an implemented component (never public security vulnerabilities).
title: "bug: "
labels:
  - "type: bug"
body:
  - type: markdown
    attributes:
      value: |
        Desktop Control is in early development; a tested S02 MCP prototype exists on an unmerged Draft PR, but there is no public supported release. Report security vulnerabilities privately through the Security tab. Redact device identifiers, paths, tokens and logs.
  - type: textarea
    id: problem
    attributes:
      label: Observed behavior
      description: What happened? Remove credentials, tokens and private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps and evidence
      description: Supply a minimal, safe reproduction and redacted logs only.
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Affected commit/version, OS and environment
      placeholder: commit SHA, Windows/Linux variant, relevant configuration
  - type: input
    id: product_milestone
    attributes:
      label: Affected product milestone and version
      description: E.g. M01; if unknown, leave blank. Do not confuse with internal session numbers.
  - type: textarea
    id: regression
    attributes:
      label: Regression and safety check
      description: Actual platform test result, reproduction commit, expected fix criterion, rollback or impact. State not run if unknown.
