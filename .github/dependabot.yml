version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels:
      - "type: maintenance"
    commit-message:
      prefix: deps
    groups:
      development-nonmajor:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
