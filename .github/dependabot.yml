version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels:
      - "type: maintenance"
    commit-message:
      prefix: deps
    groups:
      development-nonmajor:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch

  # Only version-update PRs; never auto-merge changes to workflow code.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    labels:
      - "type: maintenance"
    commit-message:
      prefix: ci-deps
